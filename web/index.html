<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heatbrain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c3 5 8 8 8 15a8 8 0 0 1-16 0c0-4 2-6 3-8 1 3 3 4 3 4 0-5 1-8 2-11z' fill='%23eb6834'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">heatbrain</div>
    <div class="updated" id="updated">connecting…</div>
  </header>

  <main>
    <section id="problems" class="problems" hidden></section>

    <section class="card">
      <div class="card-head">
        <h2>Electricity price</h2>
        <div class="muted" id="price-summary"></div>
      </div>
      <div class="chart" id="price-chart"></div>
    </section>

    <section class="rooms" id="rooms"></section>

    <section class="card" id="detail" hidden>
      <div class="card-head">
        <h2 id="detail-title"></h2>
        <div class="range" role="group" aria-label="Time range">
          <button data-hours="24" class="active">24 h</button>
          <button data-hours="72">3 days</button>
          <button data-hours="168">7 days</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="room-chart"></div>
      <h3>Switch events</h3>
      <div class="table-wrap">
        <table class="events">
          <thead><tr><th>When</th><th>State</th><th>Reason</th><th class="num">Temp</th><th class="num">Target</th><th class="num">Price</th><th>Why</th></tr></thead>
          <tbody id="events"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
