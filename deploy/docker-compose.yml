# heatbrain on a Synology NAS (Container Manager -> Project -> Create, paste this file).
#
# 1. Create the folder /volume1/docker/heatbrain on the NAS (File Station). Leave it empty:
#    heatbrain creates a starter configuration on first start and does nothing until set up.
# 2. Start this project; the web UI is at http://<nas-ip>:8080
# 3. Moving from another heatbrain: there, Settings -> System -> Export (with history);
#    here, Settings -> System -> Import. Then STOP the other heatbrain right away: Netatmo
#    rotates its login token, so two copies lock each other out (and both would switch plugs).
services:
  heatbrain:
    image: ghcr.io/bleze/heatbrain:latest
    container_name: heatbrain
    restart: unless-stopped
    ports:
      - "8080:8080"         # web UI: http://<nas-ip>:8080
    volumes:
      - /volume1/docker/heatbrain:/data
    environment:
      - TZ=Europe/Copenhagen
    stop_grace_period: 15s  # heatbrain handles SIGTERM and stops cleanly
